# 통합 릭 방어 설정 — 단일 소스
# 기존: chain_drafter.py, chain_publisher_core.py, audit/audit_chain.py, conftest.py

prompt_leak:
  # chain_drafter.py _PROMPT_LEAK_RE 패턴들
  patterns:
    - "^#\\s*Role"
    - "^#\\s*SEO\\s*기본\\s*원칙"
    - "^#\\s*Frontmatter\\s*Rules"
    - "^#\\s*Content\\s*Structure"
    - "^#\\s*Formatting\\s*Rules"
    - "^#\\s*H2\\s*제목\\s*SEO\\s*규칙"
    - "^#\\s*Tone\\s*&\\s*Manner"
    - "^#\\s*Output\\s*Checklist"
    - "^#\\s*Chain\\s*Context"
    - "^#\\s*이미지\\s*플레이스홀더"
    - "^#\\s*이미지\\s*유형\\s*판단"
    - "^##\\s*title\\s*규칙"
    - "^##\\s*description\\s*규칙"
    - "^##\\s*tags\\s*규칙"
    - "^##\\s*categories\\s*규칙"
    - "^##\\s*절대\\s*금지"
    - "^##\\s*링크"
    - "이전\\s*포스트\\s*\\("
    - "다음\\s*포스트\\s*\\("
    - "{{.*ENTRY_LINK.*}}"
    - "{{.*FUNNEL_LINK.*}}"
    - "{{.*CPA_LINK.*}}"
    - "\\[citation:\\d+\\]"
    - "참고\\s*자료\\s*:"
    - "출처\\s*:"
    - "image_type\\s*결정\\s*기준"
    - "\\*\\*\\[.*\\]\\*\\*"
  action: "remove_block"  # 헤더부터 다음 헤더까지 블록 제거

reasoning_leak:
  # deepseek-v4-flash 등이 프롬프트 지침을 "사고 과정"(planning/drafting 대화)으로
  # 본문에 출력하는 경우 제거. 발행 safety net(context="body")에서만 적용.
  # 2단계 방식 (Phase 35 방향 B):
  #   - 저특이도(patterns): 같은 문단 내 2개 이상 동시 출현 시 문단 제거 (min_signals: 2)
  #   - 초고특이도(ultra_high_signals): 1개만 출현해도 문단 전체 제거 (min_signals: 1)
  # 단독 저특이도("주의:", "표 N:", "걱정된다", "작성자는" 등 자연 출현 가능 표현)는
  # 차단 트리거로 쓰지 않음 (오탐 회귀 방지).
  min_signals: 2
  patterns:
    # 저특이도 시그니처 (2신호 동시 출현 시 문단 제거)
    - "프롬프트에서는"
    - "프롬프트는.*라고 했"
    - "금지어:"
    - "피하자"
    - "만들지 말 것"
    - "이미지 플레이스홀더"
    - "제공된 참고 자료"
    # 정상 리뷰에 자연 출현 가능 → 단독 차단 금지, 2신호 조합에서만 제거
    - "걱정된다"
    - "작성자는"
  ultra_high_signals:
    # 초고특이도 시그니처: 1개만 출현해도 문단 전체 제거 (단독 차단)
    # 정상 리뷰 본문에 자연 출현하지 않는 것만 선별 (B2/B3 실측 + T4 발행 경로 실측 보강)
    # 계열1: 한국어 계획 문장 / 계열2: 영어 사고 문장 / 계열3: 프롬프트 재인용
    min_signals: 1
    patterns:
      # 계열1 (한국어 계획)
      - "먼저 구조를 잡자"
      - "이제 글을 작성해야"
      - "이제 JSON"
      - "이제 금지 표현"
      # 계열1 보강 — 실측(10007)에서 발견된 한국어 계획/작성 단계 문장
      - '이제[^\n]{0,20}(?:작성해보겠습니다|초안|구조를 잡아보겠습니다|각 섹션을 작성)'
      - "예상 구조:"
      - "각 섹션:"
      - "금지 표현:"
      - "주의: 모든 문장은"
      - "본문 분량은"
      # 계열2 (영어 COT)
      - "Let's"
      - "Need to avoid"
      - "Provided data"
      - "chat history log"
      - "Let's parse"
      # 계열2 보강 — 실측(10006)에서 발견된 영어 사고/계획 문장
      - "Need "
      - "Price analysis"
      - "Can compare"
      - "Potential outline:"
      - "Alternative:"
      - "Now, the prompt"
      - "Then table"
      - "Add table:"
      - 'Section \d+ comparison'
      - "Paragraph:"
      - "Could we"
      - "Also \""
      - "No, too"
      - "Include \""
      # 계열3 (프롬프트 재인용)
      - "H2 가이드라인:"
      - '이 글은 \d+단계 체인'
      - 'H2 \d+:'
      # 계열3 보강 — 실측(10007)에서 발견된 프롬프트 지시 재인용
      - '작성자는[^\n]{0,40}(?:작성해야|제공한|글을 작성)'
      - "각 H2 섹션은"
      - "H2 제목은 템플릿"
      - "JSON 메타데이터"
      - "이미지 플레이스홀더"
      - '참고 자료를 바탕으로[^\n]{0,20}작성해야'
    action: "remove_paragraph"  # 1신호 단독 시 문단 제거
  action: "remove_paragraph"  # 2신호 이상 시 문단 전체 제거

plan_text_gate:
  # BUG-006: 파손 초안(draft_md가 계획텍스트 대부분) 발행 선차단 비율 게이트용 패턴.
  # reasoning_leak.ultra_high_signals(실측 보정)만으로는 chain 10007(22.5%)이
  # 임계치 20%에 근접해 마진이 얇아, 지시 문구 게이트 전용으로 한국어 계획/작성
  # 표현을 보강한다. T4(reasoning_leak 문단 제거)에는 사용하지 않는 별도 세트
  # (오탐 회귀 방지 — 이 섹션을 reasoning_leak 동작에 끌어쓰지 말 것).
  patterns:
    - "다루어야 합니다"
    - "작성해야 합니다"
    - "작성해보겠습니다"
    - "섹션은"
    - "플레이스홀더"
    - "참고 자료"
    - "이제 글을 작성"

cta_leak:
  # chain_publisher_core.py D8-GATE + audit + conftest 통합
  patterns:
    - "더\\s*(?:깊이\\s*)?알아보기"
    - "계속\\s*읽기"
    - "관련\\s*주제"
    - "아래\\s*버튼"
    - "링크를\\s*클릭"
    - "관련\\s*글"
    - "시리즈\\s*보기"
    - "이\\s*시리즈\\s*보기"
    - "전체\\s*글\\s*모아보기"
    - "모아보기"
    - "이어서\\s*(?:실전\\s*)?적용법"
    - "관련\\s*주제\\s*보기"
    - "더\\s*자세히\\s*보기"
    - "더\\s*깊이\\s*알아보기"
  action: "remove_inline"  # 매칭된 문자열만 제거
  forbidden_cta:
    - "지금\\s*(?:구매|매수|계약|청약|예약)"
    - "한정\\s*수량"
    - "마감\\s*임박"
    - "최저가\\s*보장"
    - "오늘만\\s*특가"
    - "곤두박질"
    - "오늘\\s*계약"
    - "아래\\s*버튼"
    - "링크를\\s*클릭"
  action: "warn_only"  # 발견 시 WARNING만

placeholder_leak:
  # {{...}} 패턴 (shortcode {{< >}} 제외)
  pattern: r'\{\{(?!<|%)([^}]+)\}\}'
  action: "remove_inline"

html_tag_leak:
  # 허용되지 않은 HTML 태그
  tags: ["div", "span", "meta", "script", "ins", "link", "p", "a", "table", "blockquote", "figure", "del"]
  action: "remove_block"

json_leak:
  # raw JSON 객체 (image_type, chart_type 포함)
  pattern: r'(?<!`)\n\s*\{\s*"(?:image_type|chart_type|image_keyword)"'
  action: "remove_block"
