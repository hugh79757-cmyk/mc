# CTA 템플릿 — Phase 22
# Phase 17 v2 확정안 반영: 문구는 전 카테고리 "더 알아보기 →" 통일
# 링크 목적지만 분기 (현재는 모든 카테고리 동일 구조)

cta_templates:
  # chain-card (내부이동): 다음 step 포스트 URL
  chain_card:
    text: "더 알아보기 →"
    style: "red-bg"  # #DC2626 배경 / 흰 글씨
    # 링크는 주입 시점에 next_post_url로 치환

  # hub CTA (Step 3 하단): rotcha hub 유입
  hub_cta:
    text: "전체 글 모아보기 →"
    style: "red-bg"
    placeholder: "{{ENTRY_LINK}}"  # 발행 시 hub URL로 치환

  # dual CTA 정보성 (Step 2 중간 카드 등)
  dual_info:
    text: "이 시리즈 보기 →"
    style: "red-bg"

# 카테고리별 링크 목적지 분기 (문구는 동일, URL만 다름)
# 현재는 모든 카테고리 동일: chain-card → 다음 step, hub → rotcha.kr/hub/{slug}
link_destinations:
  chain_card:
    travel:        {next_step: true}
    real_estate:   {next_step: true}
    automotive:    {next_step: true}
    stock:         {next_step: true}
    etc:           {next_step: true}
  hub_cta:
    all: rotcha_hub  # rotcha.kr/hub/{slug}

# AI 생성 CTA 감지용 패턴 (sanitize 필터에서 사용)
ai_cta_patterns:
  # 일반적 유도 문구
  - "더\\s*(?:깊이\\s*)?알아보기"
  - "계속\\s*읽기"
  - "관련\\s*주제"
  - "아래\\s*버튼"
  - "링크를\\s*클릭"
  - "관련\\s*글"
  - "시리즈\\s*보기"
  - "이\\s*시리즈\\s*보기"
  - "전체\\s*글\\s*모아보기"
  - "모아보기"
  - "이어서\\s*(?:실전\\s*)?적용법"
  - "관련\\s*주제\\s*보기"
  - "더\\s*자세히\\s*보기"
  - "더\\s*깊이\\s*알아보기"
  # 금지 표현 (CTA-SCENARIO.md §3.3)
  - "지금\\s*(?:구매|매수|계약|청약|예약)"
  - "한정\\s*수량"
  - "마감\\s*임박"
  - "최저가\\s*보장"
  - "오늘만\\s*특가"
  - "곤두박질"
  - "오늘\\s*계약"

# 플레이스홀더 패턴 (shortcode {{< >}} 제외)
placeholder_pattern: r'\{\{(?!<|%)([^}]+)\}\}'