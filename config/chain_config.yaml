chain_directions:
  depth:
    label: 깊이 (Depth)
    step_roles:
      1: 기초/정보형
      2: 분석/응용형
      3: 전문/심화형
  swallow:
    label: 역방향 (Swallow)
    step_roles:
      1: 구매/소비형
      2: 절약/관리형
      3: 금융/투자형
  lateral:
    label: 횡방향 (Lateral)
    step_roles:
      1: 주제/정보형
      2: 비교/탐색형
      3: 비즈니스/확장형
