ai_writer:
  tier: default
  temperature: 0.85
publish_mode:
  default: auto
  confirm_before_publish: true
  retry_on_failure: 3
thumbnail:
  provider: auto
  fallback_chain:
  - unsplash
  - pexels
  target_size:
  - 1024
  - 1024
  text_overlay:
    enabled: true
    font: assets/fonts/NotoSansKR-Regular.otf
    bg_alpha: 0.55
krea:
  enabled: false
  api_base: https://api.krea.ai
  model: krea/krea-2/medium
  aspect_ratio: '1:1'
  resolution: 1K
  creativity: medium
  poll_interval_seconds: 2
  poll_timeout_seconds: 90
chart:
  enabled: true
  output_dir: output/images
  filename_pattern: chart_{slug}.jpg
  font: assets/fonts/NotoSansKR-Regular.otf
  colors:
    primary: '#2563EB'
    secondary: '#DC2626'
    tertiary: '#16A34A'
  background: '#FFFFFF'
  text_color: '#1F2937'
  title_font_size: 42
  label_font_size: 28
  output_size:
  - 1200
  - 630
  jpeg_quality: 92
pollinations:
  enabled: false
  base_url: https://image.pollinations.ai/prompt/
  width: 1024
  height: 1024
  model: flux
  rate_limit_seconds: 15
loop:
  hub_url_base: https://rotcha.kr/hub
  spokes_per_hub: 3
  hub_layout: hub
  cardView: true
  cta:
    info_cta_text: 관련 글 모두 보기 →
    conv_cta_text: 추천 상품 보기 →
    conv_cta_url: ''
search:
  enabled: true
  provider: naver
  max_sources: 5
  endpoints_by_angle:
    basic:
    - encyc
    - kin
    - webkr
    advanced:
    - webkr
    - news
    - blog
    expert:
    - news
    - webkr
    - cafearticle
  display_per_endpoint: 5
  timeout: 10
  daily_quota: 25000
db_path: /Users/twinssn/Projects/5000/data/mc_chains.db
