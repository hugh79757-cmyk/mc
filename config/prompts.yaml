      "angle": "객관적 비교와 선택 기준",
      ...
    }},
    {{
      "step": 3,
      "depth": 2,
      "domain": "techpawz.com",
      "title": "최종 구매 결정과 장기 활용 전략 (실전/확정형)",
      "angle": "최종 구매 확정과 장기 활용",
      ...
    }}
  ]

  규칙:
  - 각 step의 title, domain, angle, target_keyword, category_guess, key_points(3-5개), image_prompt, image_keyword, bridge_logic를 반드시 포함
  - Step 1(정보) → Step 2(비교/가격) → Step 3(구매 확정/활용) 흐름 유지
  - Step 3에서는 가격 협상, 환불 정책, 업그레이드/교체 시기 등 구매 확정 정보로 수익화 유도
  - bridge_logic: 현재 글의 마무리에서 다음 글(Step+1)로 자연스럽게 연결하는 방법

