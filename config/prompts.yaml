  '
derive_user_depth: "시드 키워드: \"{seed}\"\n키워드 카테고리: {category}\n\n이 키워드는 **깊이 파고들기(Depth)** 방향이 적합합니다.\nStep 1(기초/정보형) → Step 2(분석/응용형) → Step 3(전문/심화형) 순서로 체인을 구성하세요.\n\n다음 조건을 만족하는 블로그 체인을 JSON 배열로 생성하세요:\n\n[\n  {{\n    \"step\": 1,\n    \"depth\": 0,\n    \"domain\": \"rotcha.kr\",\n    \"title\": \"시드 키워드에 대한 개요 및 소개 (일반 독자, 기초/정보형)\",\n    \"angle\": \"기초 개념 소개 및 중요성\",\n    \"target_keyword\": \"메인 키워드\",\n    \"category_guess\": \"IT/기술\",\n    \"key_points\": [\"핵심 포인트 3-5개\", \"...\"],\n    \"image_prompt\": \"이미지 생성을 위한 영어 프롬프트. 플랫한 스타일의 디지털 일러스트레이션 묘사\",\n    \"image_keyword\": \"이미지 파일명용 영문 키워드 (공백은 - 로)\",\n    \"bridge_logic\": \"Step 2에서 다룰 심화 내용 예고\"\n  }},\n  {{\n    \"step\": 2,\n    \"depth\": 1,\n    \"domain\": \"issue.techpawz.com\",\n    \"title\": \"Step 1 내용을 심화/구체화한 실용 가이드 (실무자, 분석/응용형)\",\n    \"angle\": \"실전 적용 방법\",\n    ...\n  }},\n  {{\n    \"step\": 3,\n    \"depth\": 2,\n    \"domain\": \"techpawz.com\",\n    \"title\": \"Step 2 주제를 기술적/미래지향적으로 확장 (전문가, 전문/심화형)\",\n    \"angle\": \"산업적 영향과 미래 전망\",\n    ...\n  }}\n]\n\n규칙:\n- 각 step의 title, domain, angle, target_keyword, category_guess, key_points(3-5개), image_prompt, image_keyword, bridge_logic를 반드시 포함\n- 각 step은 이전 단계보다 더 깊이 파고드는 방향\n- bridge_logic: 현재 글의 마무리에서 다음 글(Step+1)로 자연스럽게 연결하는 방법\n"
derive_user_swallow: "시드 키워드: \"{seed}\"\n키워드 카테고리: {category}\n\n이 키워드는 **역방향 확장(Swallow)** 방향이 적합합니다.\nStep 1(구매/소비형) → Step 2(절약/관리형) → Step 3(금융/투자형) 순서로 체인을 구성하세요.\n독자가 점점 더 실용적이고 경제적인 주제로 자연스럽게 이동하게 만드는 것이 목표입니다.\n\n다음 조건을 만족하는 블로그 체인을 JSON 배열로 생성하세요:\n\n[\n  {{\n    \"step\": 1,\n    \"depth\": 0,\n    \"domain\": \"rotcha.kr\",\n    \"title\": \"시드 키워드 상품/브랜드 정보 및 구매 가이드 (구매/소비형)\",\n    \"angle\": \"상품 정보와 구매 판단 기준\",\n    \"target_keyword\": \"메인 키워드\",\n    \"category_guess\": \"쇼핑/리뷰\",\n    \"key_points\": [\"핵심 포인트 3-5개\", \"...\"],\n    \"image_prompt\": \"이미지 생성을 위한 영어 프롬프트\",\n    \"image_keyword\": \"이미지 파일명용 영문 키워드\",\n    \"bridge_logic\": \"Step 2에서 다룰 비용/절약 팁 예고 및 할인 정보 유도\"\n  }},\n  {{\n    \"step\": 2,\n    \"depth\": 1,\n    \"domain\": \"issue.techpawz.com\",\n    \"title\": \"구매 실패 없는 소비 전략 + 비슷한 브랜드 비교 (절약/관리형)\",\n    \"angle\": \"소비자 보호와 실용적 구매 팁\",\n    ...\n  }},\n  {{\n    \"step\": 3,\n    \"depth\": 2,\n    \"domain\": \"techpawz.com\",\n    \"title\": \"소비 습관이 만드는 재테크 차이 — 쇼핑에서 투자로 (금융/투자형)\",\n    \"angle\": \"소비 패턴 개선과 재정 관리\",\n    ...\n  }}\n]\n\n규칙:\n- 각 step의 title, domain, angle, target_keyword, category_guess, key_points(3-5개), image_prompt, image_keyword, bridge_logic를 반드시 포함\n- 독자가 \"쇼핑 → 절약 → 재테크\"로 자연스럽게 이동하게 구성\n- Step 3에서는 금융 상품, 적금, 카드 등 수익화 가능한 주제로 연결\n- bridge_logic: 현재 글의 마무리에서 다음 글(Step+1)로 자연스럽게 연결하는 방법\n"
