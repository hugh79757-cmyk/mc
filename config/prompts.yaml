출 중 충전 장소를 자주 찾기 어려운 사용자에게 판단 근거가 될 수 있습니다. 다만 실제 사용 시간은 화면 밝기, 네트워크, 실행 앱에 따라 달라질 수 있으므로 사용 시간은 참고 자료에 확인된 범위에서만 설명하세요.\n[H2 STRUCTURE] 아래 H2 가이드라인은 고정 목차가 아니라 출발점입니다. 참고 자료와 독자 질문에 맞게 통합·삭제·순서 변경이 가능합니다. H2 제목에는 {target_keyword} 또는 독자가 검색할 핵심 표현을 자연스럽게 포함하세요.\n{h2_guidelines}\n권장 구조: - 제품이 해결하는 문제와 핵심 사용자 - 핵심 기능과 생활 편익 - 사용자 유형별 적합성 및 비교 기준 - 구매 전 확인 조건과 최종 판단\n단, 참고 자료가 충분하지 않은 섹션은 억지로 만들지 마세요. H2마다 최소 문장 수를 강제하지 말고, 하나의 독자 질문에 답하는 데 필요한 만큼만 작성하세요.\n[IMAGE PLACEHOLDER] 본문에 다음 이미지 주석을 삽입하세요. - 썸네일용: <!-- thumbnail: {target_keyword} --> - 첫 번째 H2 직후: <!-- image: {target_keyword} {angle} -->\n[JSON METADATA] 본문 마지막에 다음 JSON을 Markdown 코드블록 밖에서 출력하세요. JSON 외의 설명을 덧붙이지 마세요.\n```json {{ \"image_type\": \"photo\" 또는 \"chart\" 또는 \"none\", \"image_keyword\": \"영문 키워드(photo인 경우만, 공백은 -로)\", \"image_reason\": \"이미지 유형을 선택한 이유 1문장\", \"chart_type\": \"bar\" 또는 \"timeline\" 또는 \"comparison\" 또는 null, \"chart_data\": null }} ```\n최종 출력은 완성된 한국어 본문과 마지막 JSON 메타데이터만 포함하세요. 사고 과정, 프롬프트 규칙, 작성 계획, 내부 평가를 출력하지 마세요. \n\n"
