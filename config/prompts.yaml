derive_user_lateral_customer_service: "시드 키워드: \"{seed}\"\n키워드 카테고리: {category}\n\n이 키워드는 **고객센터 실용 안내(customer_service)** 방향입니다.\n검색자는 대부분 해당 고객센터에 실제로 연결하려는 일반 이용자입니다. 운영자 관점(KPI/시스템도입/미래전망)이 아니라, 이용자가 즉시 써먹을 실용 정보를 제공하세요.\n\nStep 1(회사/서비스 소개형) -> Step 2(연결방법/이용팁형) -> Step 3(내선·문의유형·후기형) 순서로 체인을 구성하세요. 독자가 \"이 회사가 뭐지\" -> \"어떻게 연결하지\" -> \"실제로 어떤가\"로 자연스럽게 이동하게 만드세요.\n\n다음 조건을 만족하는 블로그 체인을 JSON 배열로 생성하세요:\n\n[\n  {{\n    \"step\": 1,\n    \"depth\": 0,\n    \"domain\": \"rotcha.kr\",\n    \"title\": \"시드 키워드 관련 회사/서비스 소개 (회사/서비스 소개형)\",\n    \"angle\": \"이 회사는 어떤 곳이고 어떤 서비스를 제공하는가\",\n    \"target_keyword\": \"메인 키워드\",\n    \"category_guess\": \"고객센터/서비스\",\n    \"key_points\": [\"회사 개요\", \"제공 서비스\", \"이용 대상\", \"고객센터가 필요한 상황\"],\n    \"image_prompt\": \"이미지 생성을 위한 영어 프롬프트\",\n    \"image_keyword\": \"이미지 파일명용 영문 키워드\",\n    \"bridge_logic\": \"Step 2에서 다룰 고객센터 연결 방법 예고\"\n  }},\n  {{\n    \"step\": 2,\n    \"depth\": 1,\n    \"domain\": \"issue.techpawz.com\",\n    \"title\": \"시드 키워드 고객센터 연결 방법과 이용 팁 (연결방법/이용팁형)\",\n    \"angle\": \"전화번호, 채널별 연결법, 잘 되는 시간대, ARS 우회, 앱/온라인 대안\",\n    \"key_points\": [\"대표/전용 전화번호\", \"채널별 연결 방법\", \"연결 잘 되는 시간대\", \"ARS 단축 팁\", \"온라인·앱 대안\"],\n    \"bridge_logic\": \"Step 3에서 다룰 내선번호·문의유형·실제 후기 예고\"\n  }},\n  {{\n    \"step\": 3,\n    \"depth\": 2,\n    \"domain\": \"techpawz.com\",\n    \"title\": \"시드 키워드 고객센터 내선·자주 묻는 문의·이용 후기 (내선/문의유형/후기형)\",\n    \"angle\": \"업무별 내선번호, 자주 묻는 문의 유형과 해결법, 실제 이용자 후기와 평판\",\n    \"key_points\": [\"업무별 내선/메뉴 안내\", \"자주 묻는 문의 TOP\", \"문의 유형별 해결법\", \"실제 이용 후기/평판\", \"공식 사이트 안내\"],\n    \"bridge_logic\": \"공식 고객센터 사이트/전화로 안내하며 마무리\"\n  }}\n]\n\n규칙:\n- 각 step의 title, domain, angle, target_keyword, category_guess, key_points(3-5개), image_prompt, image_keyword, bridge_logic를 반드시 포함\n- Step 1(소개) -> Step 2(연결 방법/팁) -> Step 3(내선/문의유형/후기) 흐름 유지\n- 전화번호, 운영시간, 연결 방법 등 검색 자료에 근거한 실용 정보를 우선하고, 추측성 미래 전망은 배제\n- Step 3에서는 실제 이용자 관점의 후기/평판과 공식 사이트 안내로 마무리\n- bridge_logic: 현재 글의 마무리에서 다음 글(Step+1)로 자연스럽게 연결하는 방법\n"
derive_user_lateral_gov_finance: "시드 키워드: \"{seed}\"\n키워드 카테고리: {category}\n\n이 키워드는 **정부지원·금융 실용 안내(gov_finance)** 방향입니다.\n검색자는 지원금·수당·세금 등을 실제로 신청하거나 계산하려는 일반 국민입니다. 제도의 개요 -> 신청/계산 방법 -> FAQ·공식 창구 순으로 즉시 써먹을 정보를 제공하세요.\n\nStep 1(제도 개요형) -> Step 2(신청·계산 방법형) -> Step 3(FAQ·주의사항형) 순서로 체인을 구성하세요. 독자가 자연스럽게 다음 단계로 이동하도록 각 글 끝에서 다음 글을 예고하세요.\n\n다음 조건을 만족하는 블로그 체인을 JSON 배열로 생성하세요:\n\n[\n  {{\n    \"step\": 1,\n    \"depth\": 0,\n    \"domain\": \"rotcha.kr\",\n    \"title\": \"시드 키워드 관련 제도 개요형 글 제목\",\n    \"angle\": \"이 제도가 무엇이고 누가 얼마를 받는가\",\n    \"target_keyword\": \"메인 키워드\",\n    \"category_guess\": \"정부지원/금융\",\n    \"key_points\": [\"제도 개요\", \"지원 대상\", \"지원 금액\", \"핵심 요건\"],\n    \"image_prompt\": \"이미지 생성을 위한 영어 프롬프트\",\n    \"image_keyword\": \"이미지 파일명용 영문 키워드\",\n    \"bridge_logic\": \"Step 2에서 다룰 내용 예고\"\n  }},\n  {{\n    \"step\": 2,\n    \"depth\": 1,\n    \"domain\": \"issue.techpawz.com\",\n    \"title\": \"시드 키워드 신청·계산 방법형 글 제목\",\n    \"angle\": \"어떻게 신청하고 계산기로 어떻게 계산하는가\",\n    \"key_points\": [\"단계별 신청 방법\", \"계산기 사용법\", \"필요 서류\"],\n    \"bridge_logic\": \"Step 3에서 다룰 내용 예고\"\n  }},\n  {{\n    \"step\": 3,\n    \"depth\": 2,\n    \"domain\": \"techpawz.com\",\n    \"title\": \"시드 키워드 FAQ·주의사항형 글 제목\",\n    \"angle\": \"자주 묻는 질문·반려 사유·주의사항과 공식 신청 창구\",\n    \"key_points\": [\"자주 묻는 질문\", \"반려 사유\", \"주의사항\", \"공식 신청 링크\"],\n    \"bridge_logic\": \"공식 사이트/출처로 안내하며 마무리\"\n  }}\n]\n\n규칙:\n- 각 step의 title, domain, angle, target_keyword를 반드시 채우세요.\n- Step 3의 마지막은 반드시 공식 출처(공식 사이트/예약/신청 창구)로 배출되도록 구성하세요.\n- 정보 제공을 최우선으로 하고, 검색자가 실제로 써먹을 실용 정보를 담으세요."
derive_user_lateral_shopping_brand: "시드 키워드: \"{seed}\"\n키워드 카테고리: {category}\n\n이 키워드는 **쇼핑몰 브랜드 소개(shopping_brand)** 방향입니다.\n검색자는 특정 브랜드/쇼핑몰의 상품을 알아보고 구매를 고려하는 소비자입니다. 브랜드 소개 -> 인기 상품·구매 팁 -> 후기·공식몰 순으로 구성하세요.\n\nStep 1(브랜드 소개형) -> Step 2(상품·구매 팁형) -> Step 3(후기·비교형) 순서로 체인을 구성하세요. 독자가 자연스럽게 다음 단계로 이동하도록 각 글 끝에서 다음 글을 예고하세요.\n\n다음 조건을 만족하는 블로그 체인을 JSON 배열로 생성하세요:\n\n[\n  {{\n    \"step\": 1,\n    \"depth\": 0,\n    \"domain\": \"rotcha.kr\",\n    \"title\": \"시드 키워드 관련 브랜드 소개형 글 제목\",\n    \"angle\": \"이 브랜드는 어떤 곳이고 무엇으로 유명한가\",\n    \"target_keyword\": \"메인 키워드\",\n    \"category_guess\": \"쇼핑몰/브랜드\",\n    \"key_points\": [\"브랜드 소개\", \"대표 상품\", \"타깃 고객\"],\n    \"image_prompt\": \"이미지 생성을 위한 영어 프롬프트\",\n    \"image_keyword\": \"이미지 파일명용 영문 키워드\",\n    \"bridge_logic\": \"Step 2에서 다룰 내용 예고\"\n  }},\n  {{\n    \"step\": 2,\n    \"depth\": 1,\n    \"domain\": \"issue.techpawz.com\",\n    \"title\": \"시드 키워드 상품·구매 팁형 글 제목\",\n    \"angle\": \"인기 상품과 가격대, 사이즈·소재 등 구매 전 체크포인트\",\n    \"key_points\": [\"인기 상품\", \"가격대\", \"사이즈·소재 체크\", \"할인 팁\"],\n    \"bridge_logic\": \"Step 3에서 다룰 내용 예고\"\n  }},\n  {{\n    \"step\": 3,\n    \"depth\": 2,\n    \"domain\": \"techpawz.com\",\n    \"title\": \"시드 키워드 후기·비교형 글 제목\",\n    \"angle\": \"실제 구매 후기·유사 브랜드 비교·배송/교환 안내와 공식몰\",\n    \"key_points\": [\"구매 후기\", \"유사 브랜드 비교\", \"배송·교환 안내\", \"공식몰 링크\"],\n    \"bridge_logic\": \"공식 사이트/출처로 안내하며 마무리\"\n  }}\n]\n\n규칙:\n- 각 step의 title, domain, angle, target_keyword를 반드시 채우세요.\n- Step 3의 마지막은 반드시 공식 출처(공식 사이트/예약/신청 창구)로 배출되도록 구성하세요.\n- 정보 제공을 최우선으로 하고, 검색자가 실제로 써먹을 실용 정보를 담으세요."
derive_user_lateral_golf_course: "시드 키워드: \"{seed}\"\n키워드 카테고리: {category}\n\n이 키워드는 **CC 골프장 안내(golf_course)** 방향입니다.\n검색자는 특정 골프장을 예약하거나 방문을 계획하는 골퍼입니다. 코스 소개 -> 예약·요금·팁 -> 주변 갈만한 곳·후기 순으로 구성하세요.\n\nStep 1(골프장 소개형) -> Step 2(예약·요금·팁형) -> Step 3(주변 정보·후기형) 순서로 체인을 구성하세요. 독자가 자연스럽게 다음 단계로 이동하도록 각 글 끝에서 다음 글을 예고하세요.\n\n다음 조건을 만족하는 블로그 체인을 JSON 배열로 생성하세요:\n\n[\n  {{\n    \"step\": 1,\n    \"depth\": 0,\n    \"domain\": \"rotcha.kr\",\n    \"title\": \"시드 키워드 관련 골프장 소개형 글 제목\",\n    \"angle\": \"이 골프장의 코스 특징·위치·시설\",\n    \"target_keyword\": \"메인 키워드\",\n    \"category_guess\": \"골프장/CC\",\n    \"key_points\": [\"코스 특징\", \"위치·교통\", \"시설·편의\"],\n    \"image_prompt\": \"이미지 생성을 위한 영어 프롬프트\",\n    \"image_keyword\": \"이미지 파일명용 영문 키워드\",\n    \"bridge_logic\": \"Step 2에서 다룰 내용 예고\"\n  }},\n  {{\n    \"step\": 2,\n    \"depth\": 1,\n    \"domain\": \"issue.techpawz.com\",\n    \"title\": \"시드 키워드 예약·요금·팁형 글 제목\",\n    \"angle\": \"예약 방법, 그린피·카트비 등 요금, 부킹 팁\",\n    \"key_points\": [\"예약 방법\", \"그린피·카트비\", \"부킹 팁\", \"성수기 정보\"],\n    \"bridge_logic\": \"Step 3에서 다룰 내용 예고\"\n  }},\n  {{\n    \"step\": 3,\n    \"depth\": 2,\n    \"domain\": \"techpawz.com\",\n    \"title\": \"시드 키워드 주변 정보·후기형 글 제목\",\n    \"angle\": \"주변 관광지·맛집·숙박과 라운딩 후기, 공식 예약 안내\",\n    \"key_points\": [\"주변 관광지\", \"맛집·숙박\", \"라운딩 후기·코스 공략\", \"공식 예약 링크\"],\n    \"bridge_logic\": \"공식 사이트/출처로 안내하며 마무리\"\n  }}\n]\n\n규칙:\n- 각 step의 title, domain, angle, target_keyword를 반드시 채우세요.\n- Step 3의 마지막은 반드시 공식 출처(공식 사이트/예약/신청 창구)로 배출되도록 구성하세요.\n- 정보 제공을 최우선으로 하고, 검색자가 실제로 써먹을 실용 정보를 담으세요."
derive_user_lateral_medicine: "시드 키워드: \"{seed}\"\n키워드 카테고리: {category}\n\n이 키워드는 **의약품·증상 정보 안내(medicine)** 방향입니다.\n검색자는 특정 약이나 증상에 대해 정확한 정보를 얻으려는 일반 이용자입니다. 신뢰할 수 있는 정보 제공을 최우선으로 하되, 아래 의료 안전 원칙을 모든 step에서 반드시 지키세요.\n\n[의료 안전 원칙 — 필수]\n- 이 콘텐츠는 정보 제공용이며 의사의 진단이나 약사의 복약지도를 대체하지 않습니다.\n- 특정 개인에게 \"이 약을 드세요/드시지 마세요\" 식의 자가처방을 유도하지 마세요.\n- \"이 증상이면 이 병입니다\" 식의 단정적 자가진단을 유도하지 마세요.\n- 복용량·용법은 일반적으로 알려진 범위만 안내하고, 개인별 용량 조절은 의사·약사와 상담하도록 안내하세요.\n- 증상이 지속·악화되거나 이상반응이 나타나면 반드시 전문의 또는 약사와 상담하도록 각 step에서 권고하세요.\n- 정보 출처는 식약처(의약품안전나라), 제조사 공식 정보, 공인 의료기관 자료 등 공신력 있는 근거를 우선하세요.\n\nStep 1(약·증상 개요형) -> Step 2(효능·복용·주의형) -> Step 3(부작용·FAQ·전문가 상담형) 순서로 체인을 구성하세요. 독자가 \"이게 무슨 약/증상이지\" -> \"어떻게 쓰고 뭘 조심하지\" -> \"부작용은? 언제 병원 가지\"로 자연스럽게 이동하게 만드세요. 각 글 끝에서 다음 글을 예고하세요.\n\n다음 조건을 만족하는 블로그 체인을 JSON 배열로 생성하세요:\n\n[\n  {{\n    \"step\": 1,\n    \"depth\": 0,\n    \"domain\": \"rotcha.kr\",\n    \"title\": \"시드 키워드 약·증상 개요형 글 제목\",\n    \"angle\": \"이 약(또는 증상)이 무엇이고 어떤 경우에 관련되는가\",\n    \"target_keyword\": \"메인 키워드\",\n    \"category_guess\": \"의약품/증상\",\n    \"key_points\": [\"약/증상의 정의와 분류\", \"일반의약품/전문의약품 여부\", \"주로 어떤 상황에 관련되는가\", \"핵심 성분/특징 개요\"],\n    \"image_prompt\": \"이미지 생성을 위한 영어 프롬프트 (의약품/건강 관련, 특정 브랜드 로고 배제)\",\n    \"image_keyword\": \"이미지 파일명용 영문 키워드\",\n    \"bridge_logic\": \"Step 2에서 다룰 효능·복용법·주의사항 예고\"\n  }},\n  {{\n    \"step\": 2,\n    \"depth\": 1,\n    \"domain\": \"issue.techpawz.com\",\n    \"title\": \"시드 키워드 효능·복용법·주의사항형 글 제목\",\n    \"angle\": \"어떤 효능·효과가 있고 일반적으로 어떻게 사용하며 무엇을 주의해야 하는가\",\n    \"key_points\": [\"효능·효과\", \"일반적 복용법/사용법(개인별 용량은 상담 권고)\", \"복용·사용 시 주의사항\", \"함께 쓰면 안 되는 약/음식(상호작용) 개요\", \"보관 방법\"],\n    \"bridge_logic\": \"Step 3에서 다룰 부작용·FAQ·전문가 상담 예고\"\n  }},\n  {{\n    \"step\": 3,\n    \"depth\": 2,\n    \"domain\": \"techpawz.com\",\n    \"title\": \"시드 키워드 부작용·자주 묻는 질문·전문가 상담 안내형 글 제목\",\n    \"angle\": \"흔한 부작용과 이상반응, 자주 묻는 질문, 그리고 언제 어디서 전문가와 상담해야 하는가\",\n    \"key_points\": [\"흔한 부작용/이상반응\", \"이상반응 발생 시 대처와 병원 방문 기준\", \"자주 묻는 질문(FAQ)\", \"전문의/약사 상담이 필요한 경우\", \"공식 정보 출처(식약처 의약품안전나라·제조사·의료기관) 안내\"],\n    \"bridge_logic\": \"식약처 의약품안전나라 등 공식 출처와 전문가 상담 안내로 마무리\"\n  }}\n]\n\n규칙:\n- 각 step의 title, domain, angle, target_keyword, category_guess, key_points(3-5개), image_prompt, image_keyword, bridge_logic를 반드시 포함하세요.\n- Step 1(개요) -> Step 2(효능·복용·주의) -> Step 3(부작용·FAQ·전문가 상담) 흐름을 유지하세요.\n- 모든 step에서 위 [의료 안전 원칙]을 지키세요: 진단·처방 대체 아님, 자가진단·자가처방 유도 금지, 증상 지속·이상반응 시 전문의/약사 상담 권고.\n- Step 3의 마지막은 반드시 공식 출처(식약처 의약품안전나라, 제조사 공식 정보, 공인 의료기관)와 전문가 상담 안내로 배출되도록 구성하세요.\n- 정보 제공을 최우선으로 하되, 검증되지 않은 효능 주장이나 과장된 표현은 배제하세요.\n- bridge_logic: 현재 글의 마무리에서 다음 글(Step+1)로 자연스럽게 연결하는 방법을 서술하세요.\n"
derive_user_lateral_product: "시드 키워드: \"{seed}\"\n키워드 카테고리: {category}\n\n이 키워드는 **전자기기/상품 리뷰(product)** 방향입니다.\n검색자는 특정 전자기기의 스펙, 가격, 비교 정보를 알아보고 구매를 고려하는 소비자입니다. 제품 소개 -> 스펙 비교/분석 -> 구매 가이드 순으로 구성하세요.\n\nStep 1(제품 소개형) -> Step 2(비교 분석형) -> Step 3(구매 가이드형) 순서로 체인을 구성하세요. 독자가 \"이 제품이 뭐지\" -> \"다른 제품과 어떤 차이가 있지\" -> \"어디서/how much에 사지\"로 자연스럽게 이동하게 만드세요.\n\n다음 조건을 만족하는 블로그 체인을 JSON 배열로 생성하세요:\n\n[\n  {{\n    \"step\": 1,\n    \"depth\": 0,\n    \"domain\": \"rotcha.kr\",\n    \"title\": \"시드 키워드 관련 제품 소개형 글 제목\",\n    \"angle\": \"이 제품은 무엇이고 어떤 특징이 있는가\",\n    \"target_keyword\": \"메인 키워드\",\n    \"category_guess\": \"전자기기/상품\",\n    \"key_points\": [\"제품 개요\", \"핵심 스펙\", \"디자인 특징\", \"경쟁 모델\"],\n    \"image_prompt\": \"이미지 생성을 위한 영어 프롬프트 (제품 사진 스타일)\",\n    \"image_keyword\": \"이미지 파일명용 영문 키워드\",\n    \"bridge_logic\": \"Step 2에서 다룰 스펙 비교와 벤치마크 예고\"\n  }},\n  {{\n    \"step\": 2,\n    \"depth\": 1,\n    \"domain\": \"issue.techpawz.com\",\n    \"title\": \"시드 키워드 스펙 비교와 실사용 분석형 글 제목\",\n    \"angle\": \"경쟁 제품과의 스펙 비교, 실사용 경험, 장단점 분석\",\n    \"key_points\": [\"스펙 상세 비교\", \"벤치마크 결과\", \"실사용 장단점\", \"가격 대비 가치\"],\n    \"bridge_logic\": \"Step 3에서 다룰 구매 가이드와 할인 정보 예고\"\n  }},\n  {{\n    \"step\": 3,\n    \"depth\": 2,\n    \"domain\": \"techpawz.com\",\n    \"title\": \"시드 키워드 최종 구매 가이드형 글 제목\",\n    \"angle\": \"구매처 비교, 할인 혜택, 초기 설정 팁, 최종 추천\",\n    \"key_points\": [\"구매처 비교\", \"할인·프로모션\", \"초기 설정 팁\", \"최종 추천\"],\n    \"bridge_logic\": \"공식 판매처/최저가 사이트로 안내하며 마무리\"\n  }}\n]\n\n규칙:\n- 각 step의 title, domain, angle, target_keyword, category_guess, key_points(3-5개), image_prompt, image_keyword, bridge_logic를 반드시 포함\n- Step 1(제품 소개) -> Step 2(비교 분석) -> Step 3(구매 가이드) 흐름 유지\n- 스펙 수치는 반드시 제공된 검색 자료에 근거. 없는 수치를 지어내지 말 것\n- Step 3에서는 최저가 비교, 쿠팡/SSG 등 구매처, 공식 채널 안내로 수익화 유도\n- bridge_logic: 현재 글의 마무리에서 다음 글(Step+1)로 자연스럽게 연결하는 방법\n"
